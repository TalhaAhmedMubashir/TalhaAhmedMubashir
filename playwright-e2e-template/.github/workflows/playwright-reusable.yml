name: playwright-reusable
on:
  workflow_call:
    inputs:
      browser:
        required: true
        type: string
      shard:
        required: false
        type: string
        default: ''
    secrets:
      BASE_URL:
        required: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run Playwright
        run: |
          if [ -n "${{ inputs.shard }}" ]; then
            npx playwright test --project=${{ inputs.browser }} --shard ${{ inputs.shard }}
          else
            npx playwright test --project=${{ inputs.browser }}
          fi
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
